<div style="text-align: center; font-size: 0.85em; color: #999; margin-top: 10px;">
  本站总访问量 <span id="busuanzi_value_site_pv"></span> 次 &nbsp;|&nbsp;
  总访客数 <span id="busuanzi_value_site_uv"></span> 人
</div>

{{ if .Site.Params.music.enabled }}
    {{ with site.Data.music }}
        <div id="aplayer"></div>
        <script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
        <script>
            (function () {
                var data = document.getElementById('blog-music-data');
                var playlist = data ? JSON.parse(data.textContent) : [];
                if (playlist.length > 0) {
                    new APlayer({
                        container: document.getElementById('aplayer'),
                        fixed: true,
                        mini: true,
                        autoplay: false,
                        audio: playlist
                    });
                }
            })();
        </script>
    {{ end }}
{{ end }}
