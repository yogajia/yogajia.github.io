baseurl: https://yogajia.github.io/
languageCode: zh-cn
title: "Yoga's blog! :)"
theme: hugo-theme-stack
paginate: 10

enableEmoji: true
enableRobotsTXT: true

defaultContentLanguage: zh-cn
hasCJKLanguage: true

markup:
  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
    - RSS

params:
  favicon: images/favicon.png

  description: yojia 的个人博客，记录学习、生活、阅读与碎碎念。
  mainSections:
    - post

  author:
    name: yojia
    bio: 勇敢一点，勇往直前。

  sidebar:
    avatar: images/thinking.jpg
    subtitle: 勇敢一点，勇往直前。
    emoji: 🫵🏼

  article:
    math: false
    toc: true
    readingTime: true
    list:
      showTags: true
    license:
      enabled: true
      default: "本文采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。"

  comments:
    enabled: true
    provider: giscus
    giscus:
      repo: yogajia/yogajia.github.io
      repoID: R_kgDORlPkaQ
      category: Announcements
      categoryID: DIC_kwDORlPkac4C5w6g
      mapping: pathname
      lightTheme: light
      darkTheme: dark_dimmed
      lang: zh-CN

  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: tag-cloud
        params:
          limit: 12
    page:
      - type: toc

  colorScheme:
    toggle: true
    default: auto

  imageProcessing:
    cover:
      enabled: true
    content:
      enabled: true

  footer:
    since: 2026
    customText: ""

  moments:
    githubNewURL: https://github.com/yogajia/yogajia.github.io/new/main/content/moments

taxonomies:
  tag: tags

menu:
  main:
    - name: 首页
      url: /
      weight: 10
      params:
        icon: home
    - name: 归档
      url: /page/archives/
      weight: 20
      params:
        icon: archives
    - name: 标签
      url: /tags/
      weight: 30
      params:
        icon: tag
    - name: 相册
      url: /page/gallery/
      weight: 40
      params:
        icon: album
    - name: 友链
      url: /page/friends/
      weight: 50
      params:
        icon: link
    - name: 碎碎念
      url: /moments/
      weight: 60
      params:
        icon: messages
    - name: 关于
      url: /page/about/
      weight: 70
      params:
        icon: user
